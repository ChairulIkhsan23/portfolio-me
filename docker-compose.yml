services:
  mysql:
    image: mysql:8.0
    container_name: portfolio-mysql
    restart: always
    environment:
      MYSQL_DATABASE: portfolio_db
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_PASSWORD: secret123
      MYSQL_USER: portfolio_user
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - portfolio-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: portfolio-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - portfolio-network

  laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-laravel
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - portfolio-network
    environment:
      - APP_ENV=local
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp

  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel
    networks:
      - portfolio-network

  redis:
    image: redis:7-alpine
    container_name: portfolio-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - portfolio-network

  nextjs:
    image: node:20-alpine
    container_name: portfolio-nextjs
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # Jangan di-volume, biar tetep di container
    command: sh -c "npm install && npm run dev"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - WATCHPACK_POLLING=true    
      - CHOKIDAR_USEPOLLING=true 
      - NEXT_TELEMETRY_DISABLED=1
    networks:
      - portfolio-network

volumes:
  mysql_data:

networks:
  portfolio-network:
    driver: bridge